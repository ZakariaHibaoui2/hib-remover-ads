name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JavaScript parses
        run: |
          for f in src/content/*.js src/scriptlets/*.js src/redirects/*.js; do node --check "$f"; done
          # Module scripts need an .mjs name for node --check.
          for f in src/background.js src/popup/popup.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done

      - name: Python compiles
        run: python -m py_compile tools/*.py tests/*.py installer/build.py

      - name: Manifest and rules are valid
        run: |
          python - <<'PY'
          import json, pathlib
          src = pathlib.Path("src")
          m = json.loads((src / "manifest.json").read_text())
          assert m["manifest_version"] == 3
          total = 0
          for rs in m["declarative_net_request"]["rule_resources"]:
              rules = json.loads((src / rs["path"]).read_text(encoding="utf-8"))
              ids = [r["id"] for r in rules]
              assert len(ids) == len(set(ids)), f"duplicate rule ids in {rs['path']}"
              total += len(rules)
          assert total <= 30000, f"{total} rules exceeds Chrome's 30,000 guaranteed limit"
          for f in ["content/generic.css", "rules/cosmetic.json", "scriptlets/config.js", "scriptlets/hosts.json"]:
              assert (src / f).stat().st_size > 0, f
          en = json.loads((src / "_locales/en/messages.json").read_text(encoding="utf-8"))
          for loc in (src / "_locales").iterdir():
              msgs = json.loads((loc / "messages.json").read_text(encoding="utf-8"))
              assert msgs.keys() == en.keys(), f"{loc.name}: keys differ from en"
              for k, v in msgs.items():
                  assert ("$COUNT$" in v["message"]) == ("$COUNT$" in en[k]["message"]), f"{loc.name}: {k} placeholder"
          print(f"ok: {total} static rules, {len(list((src / '_locales').iterdir()))} languages")
          PY

      - name: Windows app block list is sane
        run: |
          python - <<'PY'
          import pathlib, re
          lists = pathlib.Path("windows/lists")
          block = set(lists.joinpath("block.txt").read_text().split())
          allow = set(lists.joinpath("allow.txt").read_text().split())
          assert 100_000 < len(block) < 2_000_000, len(block)
          ok = re.compile(r"^[a-z0-9._-]+$")
          assert all(ok.match(d) for d in block | allow), "unexpected character in a list"
          for must_block in ["doubleclick.net", "adeventtracker.spotify.com", "applovin.com", "ads.msn.com"]:
              assert must_block in block, must_block
          def blocked(name):
              parts = name.split(".")
              for i in range(len(parts) - 1):
                  d = ".".join(parts[i:])
                  if d in allow: return False
                  if d in block: return True
              return False
          for must_work in ["spclient.wg.spotify.com", "apresolve.spotify.com", "open.spotify.com", "login.live.com",
                            "download.windowsupdate.com", "www.google.com", "www.youtube.com", "github.com",
                            "raw.githubusercontent.com", "web.whatsapp.com", "discord.com", "store.steampowered.com"]:
              assert not blocked(must_work), must_work
          print(f"ok: {len(block)} blocked domains, {len(allow)} allowed")
          PY

      - name: No remote code
        run: |
          ! grep -rnE "\beval\(|new Function\(|https?://[^\"' ]+\.js" src --include=*.js --include=*.html \
            | grep -v "scriptlets/config.js" | grep -v "window.eval = new Proxy"

      - name: Package
        run: cd src && zip -qr ../hib-remover-ads.zip . -x "_metadata/*"

      - uses: actions/upload-artifact@v4
        with:
          name: hib-remover-ads
          path: hib-remover-ads.zip
